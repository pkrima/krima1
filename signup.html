{% extends "base.html" %}

{% block title %}Create account | AI Career Copilot{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <p class="eyebrow">START YOUR NEXT CHAPTER</p>
        <h1>Create your account</h1>
        <p class="sub-text">A more focused career journey starts here.</p>
        <form method="POST" action="{{ url_for('signup') }}" class="auth-form">
            <label for="email">Email address</label>
            <input id="email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
            <button type="submit" class="button button-primary">Create account <span aria-hidden="true">&rarr;</span></button>
        </form>
        <p class="switch-auth">
            Already have an account? <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
